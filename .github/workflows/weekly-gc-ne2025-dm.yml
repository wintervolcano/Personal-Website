name: Weekly GC NE2025 DM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  build-dm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install DM build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.23.5 scipy mpmath matplotlib astropy mwprop

      - name: Build weekly DM dataset
        run: |
          python scripts/build-gc-ne2025-dm.py --out public/data/gc_ne2025_dm.json

      - name: Commit updated dataset
        run: |
          if git diff --quiet -- public/data/gc_ne2025_dm.json; then
            echo "No DM data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/gc_ne2025_dm.json
          git commit -m "chore(data): refresh weekly GC NE2025 DM dataset"
          git push
