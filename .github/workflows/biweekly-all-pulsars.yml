name: Biweekly all-sky pulsars

on:
  workflow_dispatch:
  schedule:
    # 1st and 15th of every month (~biweekly), 04:30 UTC.
    - cron: "30 4 1,15 * *"

permissions:
  contents: write

jobs:
  build-all-pulsars:
    runs-on: ubuntu-latest
    # NE2025 derives a distance from DM for ~3800 sightlines (~25 min locally);
    # give the job plenty of headroom.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.23.5 scipy mpmath matplotlib astropy mwprop

      - name: Build all-sky pulsar snapshot
        run: |
          python scripts/build-all-pulsars.py --out public/data/all_pulsars.json

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- public/data/all_pulsars.json; then
            echo "No all-sky pulsar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/all_pulsars.json
          git commit -m "chore(data): refresh biweekly all-sky pulsar snapshot"
          git push
