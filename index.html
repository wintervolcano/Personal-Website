      <link rel="icon" type="image/svg+xml" href="/FK.svg" media="(prefers-color-scheme: light)" />

    <meta name="theme-color" content="#ffffff" />

    <!-- Fallback Open Graph meta tags (overridden by usePageMeta at runtime) -->
    <meta property="og:title" content="Fazal Kareem - Pulsar Astronomer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fazal Kareem - Pulsar Astronomer" />

    <meta name="twitter:image" content="https://www.fazalkareem.com/logo.png" />

    <!-- Structured Data (JSON-LD) for rich search results -->

      "description": "Pulsar astronomer at MPIfR, searching for new pulsars with MeerKAT and Effelsberg telescopes.",

        "https://github.com/wintervolcano",
        "https://x.com/fazkareem12",
        "https://www.linkedin.com/in/fazkareem/",
        "https://orcid.org/0000-0003-2444-838X"
      ]
    }

    <!-- Global font (Inter). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
